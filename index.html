<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --btn-gray: #333;
            --btn-light-gray: #a5a5a5;
            --accent-color: #ff9f0a;
            --result-color: #888;
            --base-font-size: 32px;
            --final-font-size: 40px; /* 25% increase from 32px */
        }

        body.android-theme { --accent-color: #2e7d32; }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { margin: 0; background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; justify-content: flex-end; }
        
        #display-container { padding: 20px; text-align: right; display: flex; flex-direction: column; min-height: 160px; justify-content: flex-end; }
        
        #history { font-size: 38px; color: #fff; min-height: 1.2em; word-wrap: break-word; font-weight: 400; letter-spacing: -1px; margin-bottom: 5px; }
        
        /* The Live Result */
        #display { font-size: var(--base-font-size); font-weight: 300; color: var(--result-color); line-height: 1.2; transition: all 0.2s; }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px; }
        button { border: none; border-radius: 50%; height: 75px; width: 75px; font-size: 28px; cursor: pointer; background: var(--btn-gray); color: #fff; outline: none; display: flex; align-items: center; justify-content: center; transition: filter 0.1s; }
        button:active { filter: brightness(1.3); }
        
        .btn-light { background: var(--btn-light-gray); color: #000; }
        .btn-accent { background: var(--accent-color); }
        
        .android-theme .btn-accent { background: var(--btn-light-gray); color: #000; }
        .android-theme .btn-equal { background: var(--accent-color); color: #fff; }

        #settings { display: none; position: fixed; inset: 0; background: #1c1c1e; z-index: 100; padding: 40px 20px; text-align: left; }
        #settings input { width: 100%; padding: 15px; margin: 10px 0 20px; border-radius: 8px; border: none; font-size: 16px; background: #2c2c2e; color: white; }
        .save-btn { background: #2e7d32; color: white; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; border: none; }
    </style>
</head>
<body id="body">
    <div id="settings">
        <h2>Settings</h2>
        <label>Force Number</label>
        <input type="number" id="forceNumInput">
        <label>Send Nth Number to Cloud</label>
        <input type="number" id="cloudIndexInput">
        <label>Google Script URL</label>
        <input type="text" id="scriptUrlInput">
        <button class="save-btn" onclick="saveSettings()">Save & Close</button>
    </div>

    <div id="display-container">
        <div id="history"></div>
        <div id="display">0</div>
    </div>

    <div class="grid">
        <button class="btn-light" onclick="handlePress('back')">&#9003;</button>
        <button class="btn-light" onclick="handlePress('AC')">AC</button>
        <button class="btn-light" id="percentBtn">%</button>
        <button class="btn-accent" onclick="handlePress('/')">&divide;</button>
        
        <button onclick="handlePress('7')">7</button>
        <button onclick="handlePress('8')">8</button>
        <button onclick="handlePress('9')">9</button>
        <button class="btn-accent" onclick="handlePress('*')">&times;</button>
        
        <button onclick="handlePress('4')">4</button>
        <button onclick="handlePress('5')">5</button>
        <button onclick="handlePress('6')">6</button>
        <button class="btn-accent" id="minusBtn" onpointerdown="startHold('-')" onpointerup="endHold()" onclick="handlePress('-')">&minus;</button>
        
        <button onclick="handlePress('1')">1</button>
        <button onclick="handlePress('2')">2</button>
        <button onclick="handlePress('3')">3</button>
        <button class="btn-accent" id="plusBtn" onpointerdown="startHold('+')" onpointerup="endHold()" onclick="handlePress('+')">+</button>
        
        <button id="themeBtn">+/-</button>
        <button onclick="handlePress('0')">0</button>
        <button onclick="handlePress('.')">.</button>
        <button class="btn-accent btn-equal" onclick="handlePress('=')">=</button>
    </div>

    <script>
        let currentInput = "";
        let equationArr = [];
        let magicMode = false;
        let magicDigits = [];
        let magicIndex = 0;
        let holdTimer;
        let lastTappedOp = "";
        let isFaceDown = false;

        const config = JSON.parse(localStorage.getItem('calc_settings')) || { theme: 'ios', forceNum: "0", cloudIndex: 2, scriptUrl: '' };

        const display = document.getElementById('display');
        const historyDisplay = document.getElementById('history');

        // Settings / Theme Logic
        let themeClicks = 0, percentClicks = 0;
        document.getElementById('themeBtn').onclick = () => { themeClicks++; if(themeClicks === 2) { config.theme = config.theme==='ios'?'android':'ios'; applyTheme(); saveSettings(); } setTimeout(()=>themeClicks=0, 400); };
        document.getElementById('percentBtn').onclick = () => { percentClicks++; if(percentClicks === 2) document.getElementById('settings').style.display='block'; setTimeout(()=>percentClicks=0, 400); };

        // Hold Logic for Magic Trigger
        function startHold(op) {
            holdTimer = setTimeout(() => {
                if (lastTappedOp === op) triggerMagic();
            }, 1000);
        }
        function endHold() { clearTimeout(holdTimer); }

        function triggerMagic() {
            startMagicSetup();
            magicMode = true;
            if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
        }

        function handlePress(val) {
            const currentTotal = getRunningTotal();
            const target = parseFloat(config.forceNum);

            // Reset font and color when starting a new input or clear
            if (val !== '=') {
                display.style.color = "var(--result-color)";
                display.style.fontSize = "var(--base-font-size)";
            }

            if (val === 'AC') {
                currentInput = ""; equationArr = []; magicMode = false;
                lastTappedOp = "";
            } else if (val === 'back') {
                currentInput = currentInput.slice(0, -1);
            } else if (val === '=') {
                sendToCloud();
                let finalVal = magicMode ? config.forceNum : getRunningTotal();
                historyDisplay.innerText = "";
                display.innerText = finalVal;
                
                // Final Appearance Updates
                display.style.color = "#ffffff"; 
                display.style.fontSize = "var(--final-font-size)"; // 25% Increase
                
                currentInput = finalVal.toString();
                equationArr = [];
                magicMode = false;
                lastTappedOp = "";
                return;
            } else if (['+', '-', '*', '/'].includes(val)) {
                // Request sensor permission if first operator hit
                if (equationArr.length === 0 && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission();
                }

                // Setup magic digits if flip condition met
                if ((val === '+' && target > currentTotal) || (val === '-' && target < currentTotal)) {
                    startMagicSetup(); 
                }

                if (currentInput !== "") equationArr.push(currentInput);
                let visualOp = val==='*'?'×':val==='/'?'÷':val==='-'?'−':'+';
                
                // Prevents double operator logic
                if (equationArr.length > 0 && ['×','÷','−','+'].includes(equationArr[equationArr.length-1]) && currentInput === "") {
                    equationArr[equationArr.length-1] = visualOp;
                } else {
                    equationArr.push(visualOp);
                }
                
                currentInput = "";
                lastTappedOp = val;
            } else {
                currentInput += val;
            }
            updateUI();
        }

        function getRunningTotal() {
            try {
                let str = (equationArr.join('') + currentInput).replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
                // If ends in operator, evaluate string without it
                if (!str) return 0;
                if (/[\+\-\*\/]$/.test(str)) str = str.slice(0, -1);
                return eval(str) || 0;
            } catch { return 0; }
        }

        function updateUI() {
            historyDisplay.innerText = equationArr.join('') + currentInput;
            // Only update display text if we haven't hit "Equals" yet
            if (display.style.color !== "rgb(255, 255, 255)") {
                display.innerText = getRunningTotal();
            }
        }

        function startMagicSetup() {
            let running = getRunningTotal();
            let diff = Math.abs(running - parseFloat(config.forceNum));
            magicDigits = diff.toString().split('').filter(d => d !== '.');
            magicIndex = 0;
        }

        // Sensor Logic
        window.addEventListener('deviceorientation', (e) => {
            if (Math.abs(e.beta) > 160 && !isFaceDown) {
                isFaceDown = true;
                if (magicDigits.length > 0) {
                    magicMode = true; 
                    if(navigator.vibrate) navigator.vibrate(100);
                }
            } else if (Math.abs(e.beta) < 100) { isFaceDown = false; }
        });

        // Secret Taps
        document.body.addEventListener('click', (e) => {
            if (document.getElementById('settings').style.display === 'block') return;
            if ((isFaceDown || magicMode) && magicIndex < magicDigits.length) {
                if (isFaceDown || e.target.tagName !== 'BUTTON') {
                    currentInput += magicDigits[magicIndex];
                    magicIndex++;
                    updateUI();
                    if(navigator.vibrate) navigator.vibrate(40);
                }
            }
        });

        function applyTheme() { document.body.className = config.theme === 'android' ? 'android-theme' : ''; }
        
        function saveSettings() {
            config.forceNum = document.getElementById('forceNumInput').value || "0";
            config.cloudIndex = document.getElementById('cloudIndexInput').value || 2;
            config.scriptUrl = document.getElementById('scriptUrlInput').value || '';
            localStorage.setItem('calc_settings', JSON.stringify(config));
            document.getElementById('settings').style.display = 'none';
            applyTheme();
        }

        async function sendToCloud() {
            if (!config.scriptUrl) return;
            let parts = [...equationArr, currentInput].filter(x => !['+','−','×','÷'].includes(x) && x !== "");
            if (parts[config.cloudIndex - 1]) {
                fetch(config.scriptUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ value: parts[config.cloudIndex - 1] }) });
            }
        }

        applyTheme();
        document.getElementById('forceNumInput').value = config.forceNum;
        document.getElementById('cloudIndexInput').value = config.cloudIndex;
        document.getElementById('scriptUrlInput').value = config.scriptUrl;
    </script>
</body>
</html>
