<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --btn-number: #171719;
            --btn-operator: #919191;
            --btn-func: #2d2d2f;
            --accent-green: #2bd45e;
            --icon-gray: #777;
        }

        body.ios-theme {
            --bg-color: #000;
            --text-color: #fff;
            --btn-number: #333333;
            --btn-operator: #333333;
            --btn-func: #a5a5a5;
            --accent-green: #ff9f0a;
            --icon-gray: #8e8e93;
        }

        * { box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { margin: 0; background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; transition: 0.3s; }

        #magic-dot { position: fixed; bottom: 15px; left: 15px; width: 6px; height: 6px; background: #333; border-radius: 50%; display: none; z-index: 3000; }

        /* Requirement: Top align + 75px margin */
        #display-container { 
            padding: 0 25px; 
            text-align: right; 
            display: flex; 
            flex-direction: column; 
            height: 35%; 
            justify-content: flex-start; 
            margin-top: 75px; 
        }
        
        /* Requirement: Input remains top, Result below */
        #history { 
            font-size: 52px; 
            font-weight: 200;
            min-height: 1.2em; 
            line-height: 1.1; 
            word-break: break-all;
            white-space: pre-wrap;
            width: 100%;
        }
        
        #display { 
            font-size: 28px; 
            color: #888; 
            margin-top: 10px; 
            font-weight: 300; 
            height: 1.2em;
        }

        .icon-bar { display: flex; align-items: center; padding: 0 25px 5px 25px; position: relative; }
        .icon-group { display: flex; gap: 35px; align-items: center; }
        .icon-group svg { width: 22px; height: 22px; fill: var(--icon-gray); }
        
        .scientific-svg { stroke: var(--icon-gray) !important; color: var(--icon-gray) !important; }

        .back-btn { background: none; border: none; padding: 0; outline: none; cursor: pointer; position: absolute; right: 25px; display: flex; align-items: center; }
        .back-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--accent-green); stroke-width: 2.5; }

        /* Separator Spacing */
        .divider { height: 1.5px; background-color: #555; margin: 15px 20px 20px 20px; opacity: 0.6; }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 15px 25px 15px; margin-top: auto; }
        button { border: none; border-radius: 50%; height: 78px; width: 78px; font-size: 30px; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; margin: auto; }
        button:active { filter: brightness(1.3); }

        .btn-num { background: var(--btn-number); }
        .btn-op { background: var(--btn-operator); color: #000; font-size: 36px; }
        .btn-fn { background: var(--btn-func); }
        .btn-eq { background: var(--accent-green) !important; color: #fff; }

        /* Restored Settings UI */
        #pass-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; }
        #settings { display: none; position: fixed; inset: 0; background: #1c1c1e; z-index: 1000; padding: 40px 25px; overflow-y: auto; color: white; }
        .set-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    </style>
</head>
<body>
    <div id="magic-dot"></div>
    <div id="pass-overlay">
        <div style="text-align:center;">
            <h3 style="color:white; font-weight:normal; margin-bottom:20px;">System Update</h3>
            <input type="password" id="passInput" inputmode="numeric" placeholder="••••" style="background:#222; border:none; color:white; padding:15px; border-radius:12px; text-align:center; font-size:24px; outline:none; width:180px;">
        </div>
    </div>
    
    <div id="settings">
        <h2 style="margin-top:0; font-weight:normal;">Settings</h2>
        <div class="set-row">
            <span>Magic Active</span>
            <input type="checkbox" id="masterToggle" style="width:20px; height:20px;">
        </div>
        <label>Active Slot</label>
        <select id="activeSlot" style="width:100%; padding:12px; margin:10px 0 20px; border-radius:8px; background:#2c2c2e; color:white; border:none;">
            <option value="f1">Slot 1</option><option value="f2">Slot 2</option><option value="f3">Slot 3</option><option value="f4">Slot 4</option><option value="f5">Slot 5</option>
        </select>
        <div id="slot-inputs">
            <label>Slot 1</label><input type="number" id="f1" style="width:100%; padding:12px; margin:5px 0 15px; background:#2c2c2e; color:white; border:none; border-radius:8px;">
            <label>Slot 2</label><input type="number" id="f2" style="width:100%; padding:12px; margin:5px 0 15px; background:#2c2c2e; color:white; border:none; border-radius:8px;">
            <label>Slot 3</label><input type="number" id="f3" style="width:100%; padding:12px; margin:5px 0 15px; background:#2c2c2e; color:white; border:none; border-radius:8px;">
            <label>Slot 4</label><input type="number" id="f4" style="width:100%; padding:12px; margin:5px 0 15px; background:#2c2c2e; color:white; border:none; border-radius:8px;">
            <label>Slot 5</label><input type="number" id="f5" style="width:100%; padding:12px; margin:5px 0 15px; background:#2c2c2e; color:white; border:none; border-radius:8px;">
        </div>
        <button onclick="saveSettings()" style="width:100%; padding:18px; border-radius:12px; border:none; background:var(--accent-green); color:white; font-weight:bold;">Save Changes</button>
    </div>

    <div id="display-container">
        <div id="history"></div>
        <div id="display"></div>
    </div>

    <div class="icon-bar">
        <div class="icon-group">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8zm.5-13H11v6l5.2 3.1.8-1.2-4.5-2.7V7z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M21 8H3c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2zm0 6H3v-4h2v2h2v-2h2v2h2v-2h2v2h2v-2h2v2h2v-2h2v2h2v-2h2v4z"/></svg>
            <svg viewBox="0 0 24 24" class="scientific-svg" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="4"/>
                <line x1="8" y1="12" x2="16" y2="12" stroke="#000" stroke-width="2.5"/>
                <circle cx="12" cy="8.2" r="1.2" fill="#000" stroke="none"/>
                <circle cx="12" cy="15.8" r="1.2" fill="#000" stroke="none"/>
            </svg>
        </div>
        <button class="back-btn" onclick="handlePress('back')">
            <svg viewBox="0 0 24 24"><path d="M21 4H8l-7 8 7 8h13c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"/><path d="M16 9l-4 6M12 9l4 6" stroke-linecap="round"/></svg>
        </button>
    </div>
    <div class="divider"></div>

    <div class="grid">
        <button class="btn-fn" onclick="handlePress('AC')">C</button>
        <button class="btn-fn">( )</button>
        <button class="btn-fn" id="percentBtn">%</button>
        <button class="btn-op" onclick="handlePress('/')">&divide;</button>
        <button class="btn-num" onclick="handlePress('7')">7</button>
        <button class="btn-num" onclick="handlePress('8')">8</button>
        <button class="btn-num" onclick="handlePress('9')">9</button>
        <button class="btn-op" onclick="handlePress('*')">&times;</button>
        <button class="btn-num" onclick="handlePress('4')">4</button>
        <button class="btn-num" onclick="handlePress('5')">5</button>
        <button class="btn-num" onclick="handlePress('6')">6</button>
        <button class="btn-op" id="minusBtn" onpointerdown="startHold('-')" onpointerup="endHold()" onclick="handlePress('-')">&minus;</button>
        <button class="btn-num" onclick="handlePress('1')">1</button>
        <button class="btn-num" onclick="handlePress('2')">2</button>
        <button class="btn-num" onclick="handlePress('3')">3</button>
        <button class="btn-op" id="plusBtn" onpointerdown="startHold('+')" onpointerup="endHold()" onclick="handlePress('+')">+</button>
        <button class="btn-num" id="themeBtn">+/-</button>
        <button class="btn-num" onclick="handlePress('0')">0</button>
        <button class="btn-num" onclick="handlePress('.')">.</button>
        <button class="btn-op btn-eq" id="equalBtn" onpointerdown="startEqualHold()" onpointerup="endEqualHold()" onclick="handlePress('=')">=</button>
    </div>

    <script>
        let currentInput = "", equationArr = [], magicMode = false, magicDigits = [], magicIndex = 0;
        let holdTimer, equalHoldTimer, lastTappedOp = "", isFaceDown = false, masterActive = false, equalHoldTriggered = false;
        let themeClicks = 0, percentClicks = 0, justEvaluated = false;

        const config = JSON.parse(localStorage.getItem('calc_settings')) || { theme:'dark', activeSlot:'f1', f1:"0", f2:"0", f3:"0", f4:"0", f5:"0" };
        const histDiv = document.getElementById('history'), dispDiv = document.getElementById('display'), dot = document.getElementById('magic-dot');

        function v() { if (navigator.vibrate) navigator.vibrate(12); }
        function p() { if (navigator.vibrate) navigator.vibrate([25, 40, 25]); }

        function formatNum(n) {
            if (!n || n === "-") return n;
            let parts = n.toString().split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return parts.join('.');
        }

        function processWrap(text) {
            let result = "";
            let currentLineLength = 0;
            const chars = text.split('');
            const ops = ['+','−','×','÷'];
            
            for (let i = 0; i < chars.length; i++) {
                let char = chars[i];
                let isOp = ops.includes(char);
                if (currentLineLength >= 25 || (isOp && currentLineLength > 20)) {
                    result += "\n";
                    currentLineLength = 0;
                }
                result += char;
                currentLineLength++;
            }
            return result;
        }

        function adjustFont() {
            // Force fixed large font for first 25 chars to prevent "jumping"
            const raw = histDiv.innerText.replace(/\n/g, '');
            if (raw.length > 50) histDiv.style.fontSize = "22px";
            else if (raw.length > 25) histDiv.style.fontSize = "32px";
            else histDiv.style.fontSize = "52px";
        }

        function updateUI() {
            if (justEvaluated) return;
            let h = "", temp = "";
            const pr = (c) => {
                if (['+','−','×','÷'].includes(c)) {
                    if (temp) h += formatNum(temp);
                    h += c;
                    temp = "";
                } else temp += c;
            };
            equationArr.forEach(item => { item.split('').forEach(pr); });
            currentInput.split('').forEach(pr);
            if (temp) h += formatNum(temp);
            
            histDiv.innerText = processWrap(h) || "0";
            dispDiv.innerText = equationArr.length >= 1 ? formatNum(getTotal()) : "";
            adjustFont();
        }

        function handlePress(val) {
            if (magicMode) { if (val === '=') { if (equalHoldTriggered) evaluate(); else inject(); } return; }
            justEvaluated = false;
            if (val === 'AC') { currentInput = ""; equationArr = []; magicMode = false; dot.style.display = 'none'; }
            else if (val === 'back') { if (currentInput !== "") currentInput = currentInput.slice(0, -1); else if (equationArr.length > 0) equationArr.pop(); }
            else if (val === '=') { evaluate(); return; } 
            else if (['+', '-', '*', '/'].includes(val)) {
                let op = val==='*'?'×':val==='/'?'÷':val==='-'?'−':'+';
                if (currentInput === "" && equationArr.length > 0) equationArr[equationArr.length-1] = op;
                else { if (currentInput !== "") equationArr.push(currentInput); equationArr.push(op); }
                currentInput = ""; lastTappedOp = val;
            } else currentInput += val;
            updateUI();
        }

        function evaluate() {
            let res = (magicIndex > 0 || dot.style.display === 'block') ? config[config.activeSlot] : getTotal();
            histDiv.innerText = formatNum(res);
            dispDiv.innerText = "";
            currentInput = res.toString(); equationArr = []; magicMode = false; dot.style.display = 'none';
            justEvaluated = true;
            adjustFont();
        }

        function getTotal() {
            try {
                let s = (equationArr.join('') + currentInput).replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/,/g, '');
                return eval(s) || 0;
            } catch { return 0; }
        }

        function inject() {
            if (magicIndex < magicDigits.length) {
                currentInput += magicDigits[magicIndex++];
                if (magicIndex >= magicDigits.length) dot.style.display = 'none';
                updateUI();
            }
        }

        function startHold(op) { holdTimer = setTimeout(() => { if (lastTappedOp === op && masterActive) { setupMagic(); magicMode = true; dot.style.display = 'block'; p(); } }, 1000); }
        function endHold() { clearTimeout(holdTimer); }
        function startEqualHold() { equalHoldTriggered = false; equalHoldTimer = setTimeout(() => { if (magicMode) { equalHoldTriggered = true; magicMode = false; dot.style.display = 'none'; p(); } }, 600); }
        function endEqualHold() { clearTimeout(equalHoldTimer); }
        
        function setupMagic() {
            let cur = getTotal(), tgt = parseFloat(config[config.activeSlot] || 0);
            magicDigits = Math.abs(cur - tgt).toString().split('').filter(d => d !== '.');
            magicIndex = 0;
        }

        window.addEventListener('deviceorientation', (e) => { if (Math.abs(e.beta) > 160 && masterActive) { setupMagic(); magicMode = true; dot.style.display = 'block'; p(); } });
        
        document.getElementById('themeBtn').onclick = () => { if(++themeClicks === 2) { config.theme = config.theme === 'dark' ? 'ios' : 'dark'; document.body.className = config.theme === 'ios' ? 'ios-theme' : ''; saveToLocal(); } setTimeout(()=>themeClicks=0, 400); };
        
        document.getElementById('percentBtn').onclick = () => { if(++percentClicks === 2) { document.getElementById('pass-overlay').style.display='flex'; document.getElementById('passInput').focus(); } setTimeout(()=>percentClicks=0, 400); };
        
        document.getElementById('passInput').addEventListener('input', (e) => { if (e.target.value === "0702") { document.getElementById('pass-overlay').style.display = 'none'; document.getElementById('settings').style.display = 'block'; e.target.value=""; } });

        function saveToLocal() { localStorage.setItem('calc_settings', JSON.stringify(config)); }

        function saveSettings() { 
            masterActive = document.getElementById('masterToggle').checked; 
            config.activeSlot = document.getElementById('activeSlot').value;
            ['f1','f2','f3','f4','f5'].forEach(id => config[id] = document.getElementById(id).value || "0");
            saveToLocal();
            document.getElementById('settings').style.display = 'none'; 
        }
        
        // Initial setup
        document.body.className = config.theme === 'ios' ? 'ios-theme' : '';
        document.getElementById('masterToggle').checked = masterActive;
        document.getElementById('activeSlot').value = config.activeSlot;
        ['f1','f2','f3','f4','f5'].forEach(id => document.getElementById(id).value = config[id]);
        updateUI();
    </script>
</body>
</html>
