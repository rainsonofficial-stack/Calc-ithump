<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --btn-num: #171719;
            --btn-op: #919191;
            --btn-top: #2d2d2f;
            --green: #21A613;
            --result-color: #fff;
            --base-font-size: 40px;
            --final-font-size: 55px; 
        }
        body.android-theme { --green: #21A613; } /* Maintaining theme structure just in case */
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { margin: 0; background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; justify-content: flex-end; }
        
        /* Display Area */
        #display-container { 
            padding: 20px 30px; 
            text-align: right; 
            display: flex; 
            flex-direction: column; 
            flex-grow: 1;
            justify-content: flex-start; /* Top align */
            padding-top: 75px; /* Margin from top */
        }
        
        #history { 
            font-size: 30px; 
            color: #fff; 
            min-height: 1.2em; 
            font-weight: 400; 
            margin-bottom: 5px; 
            white-space: normal; 
            word-break: keep-all; 
            overflow-wrap: break-word; 
            line-height: 1.2; 
            display: block; 
        }
        
        .op-green { color: var(--green); margin: 0 4px; }
        
        #display { 
            font-size: var(--base-font-size); 
            font-weight: 300; 
            color: var(--text-color); 
            line-height: 1.2; 
            transition: all 0.2s; 
            margin-top: 10px;
        }

        /* Tool Icons Row */
        .tools-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px 10px 25px;
            height: 50px;
        }
        .tool-icons-left {
            display: flex;
            gap: 25px;
            color: #494949;
        }
        .tool-icon svg {
            width: 24px;
            height: 24px;
            fill: #494949;
        }
        .backspace-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
        }
        .backspace-btn svg {
            width: 28px;
            height: 28px;
            fill: var(--green);
        }

        /* Separator Line */
        .separator {
            height: 1px;
            background-color: #333;
            margin: 0 15px 15px 15px;
            opacity: 0.5;
        }

        /* Grid */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            padding: 15px; 
            z-index: 10; 
            padding-bottom: 30px;
        }
        
        button { 
            border: none; 
            border-radius: 50%; 
            height: calc((100vw - 30px - 40px) / 4); /* Dynamic size */
            width: 100%;
            font-size: 32px; 
            cursor: pointer; 
            background: var(--btn-num); 
            color: #fff; 
            outline: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: filter 0.1s; 
        }
        button:active { filter: brightness(1.3); }
        
        .btn-top { background: var(--btn-top); color: #fff; font-size: 28px; }
        .btn-op { background: var(--btn-op); color: #fff; font-size: 36px; font-weight: 300; }
        .btn-equal { background: var(--green); color: #fff; font-size: 36px; }
        
        /* Overlays */
        #magic-indicator { position: fixed; bottom: 15px; left: 15px; width: 8px; height: 8px; background: rgba(128, 128, 128, 0.3); border-radius: 50%; display: none; z-index: 100; }
        #pass-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; }
        .pass-card { background: #1c1c1e; padding: 25px; border-radius: 20px; width: 280px; text-align: center; color: white; border: 0.5px solid #333; }
        .pass-card h3 { margin: 0 0 15px 0; font-size: 18px; font-weight: 600; }
        .pass-card input { width: 100%; background: #2c2c2e; border: none; padding: 12px; color: white; border-radius: 8px; text-align: center; font-size: 20px; outline: none; margin-bottom: 10px; }
        #settings { display: none; position: fixed; inset: 0; background: #1c1c1e; z-index: 1000; padding: 40px 20px; text-align: left; overflow-y: auto; color: white; }
        #settings input, #settings select { width: 100%; padding: 12px; margin: 8px 0 15px; border-radius: 8px; border: none; font-size: 16px; background: #2c2c2e; color: white; outline: none; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .toggle-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2e7d32; }
        input:checked + .slider:before { transform: translateX(24px); }
        .save-btn { background: #2e7d32; color: white; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; border: none; margin-top: 10px; }
    </style>
</head>
<body id="body">
    <div id="magic-indicator"></div>
    <div id="pass-overlay"><div class="pass-card"><h3>App needs update</h3><input type="password" id="passInput" inputmode="numeric" placeholder="••••"></div></div>
    
    <div id="settings">
        <h2>Settings</h2>
        <div class="setting-row"><span>Magic Active (Master Switch)</span><label class="toggle-switch"><input type="checkbox" id="masterToggle"><span class="slider"></span></label></div>
        <label>Active Slot</label><select id="activeSlot"><option value="f1">Slot 1</option><option value="f2">Slot 2</option><option value="f3">Slot 3</option><option value="f4">Slot 4</option><option value="f5">Slot 5</option></select>
        <label>Slot 1</label><input type="number" id="f1"><label>Slot 2</label><input type="number" id="f2"><label>Slot 3</label><input type="number" id="f3"><label>Slot 4</label><input type="number" id="f4"><label>Slot 5</label><input type="number" id="f5">
        <label>Send Nth Number to Cloud</label><input type="number" id="cloudIndexInput"><label>Google Script URL</label><input type="text" id="scriptUrlInput">
        <button class="save-btn" onclick="saveSettings()">Save & Close</button>
    </div>

    <div id="display-container">
        <div id="history"></div>
        <div id="display"></div>
    </div>

    <div class="tools-row">
        <div class="tool-icons-left">
            <div class="tool-icon">
                <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            </div>
            <div class="tool-icon">
                <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H3V8h2v4h2V8h2v4h2V8h2v4h2V8h2v4h2V8h2v8z"/></svg>
            </div>
            <div class="tool-icon">
                 <svg viewBox="0 0 24 24"><path d="M7 2h10v2H7zM6 6h2v2H6zm0 4h2v2H6zm0 4h2v2H6zm6-8h2v2h-2zm0 4h2v2h-2zm0 4h2v2h-2zm6-8h2v2h-2zm0 4h2v2h-2zm0 4h2v2h-2zM4 20h16v2H4z"/></svg>
            </div>
        </div>
        <button class="backspace-btn" onclick="handlePress('back')">
            <svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>
        </button>
    </div>

    <div class="separator"></div>

    <div class="grid">
        <button class="btn-top" onclick="handlePress('AC')">C</button>
        <button class="btn-top" onclick="handlePress('paren')">( )</button>
        <button class="btn-top" id="percentBtn">%</button>
        <button class="btn-op" onclick="handlePress('/')">&divide;</button>
        
        <button onclick="handlePress('7')">7</button>
        <button onclick="handlePress('8')">8</button>
        <button onclick="handlePress('9')">9</button>
        <button class="btn-op" onclick="handlePress('*')">&times;</button>
        
        <button onclick="handlePress('4')">4</button>
        <button onclick="handlePress('5')">5</button>
        <button onclick="handlePress('6')">6</button>
        <button class="btn-op" id="minusBtn" onpointerdown="startHold('-')" onpointerup="endHold()" onclick="handlePress('-')">&minus;</button>
        
        <button onclick="handlePress('1')">1</button>
        <button onclick="handlePress('2')">2</button>
        <button onclick="handlePress('3')">3</button>
        <button class="btn-op" id="plusBtn" onpointerdown="startHold('+')" onpointerup="endHold()" onclick="handlePress('+')">+</button>
        
        <button id="themeBtn">+/-</button>
        <button onclick="handlePress('0')">0</button>
        <button onclick="handlePress('.')">.</button>
        <button class="btn-equal" id="equalBtn" onpointerdown="startEqualHold()" onpointerup="endEqualHold()" onclick="handlePress('=')">=</button>
    </div>

    <script>
        let currentInput = "", equationArr = [], magicMode = false, magicDigits = [], magicIndex = 0;
        let holdTimer, equalHoldTimer, lastTappedOp = "", isFaceDown = false, masterActive = false, equalHoldTriggered = false;
        let themeClicks = 0, percentClicks = 0, justEvaluated = false;

        const defaultConfig = { theme:'ios', activeSlot:'f1', f1:"0", f2:"0", f3:"0", f4:"0", f5:"0", cloudIndex:2, scriptUrl:'' };
        const config = JSON.parse(localStorage.getItem('calc_settings')) || defaultConfig;
        const display = document.getElementById('display'), historyDisplay = document.getElementById('history'), indicator = document.getElementById('magic-indicator');

        function v() { 
            if (!navigator.vibrate) return;
            if (magicMode && magicIndex >= magicDigits.length) return;
            navigator.vibrate(15); 
        }
        function p() { if (navigator.vibrate) navigator.vibrate([20, 40, 20]); }

        window.addEventListener('pointerdown', (e) => {
            if (magicMode) {
                v();
                if (e.target.id === 'equalBtn') return;
                // Allow backspace to work even in magic mode for correction
                if (e.target.closest('.backspace-btn')) return; 
                e.preventDefault(); e.stopPropagation();
                inject();
            } else if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
                v();
            }
        }, true);

        window.addEventListener('click', (e) => { if (magicMode && e.target.id !== 'equalBtn' && !e.target.closest('.backspace-btn')) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);

        function inject() {
            if (magicIndex < magicDigits.length) {
                currentInput += magicDigits[magicIndex++];
                if (magicIndex >= magicDigits.length) indicator.style.display = 'none';
                updateUI();
            }
        }

        function trigger() {
            if (!masterActive || magicMode) return;
            setup();
            if (magicDigits.length > 0) { magicMode = true; indicator.style.display = 'block'; p(); }
        }

        function startHold(op) { holdTimer = setTimeout(() => { if (lastTappedOp === op) trigger(); }, 1000); }
        function endHold() { clearTimeout(holdTimer); }
        
        function startEqualHold() { 
            equalHoldTriggered = false;
            equalHoldTimer = setTimeout(() => { 
                if (magicMode) { equalHoldTriggered = true; magicMode = false; indicator.style.display = 'none'; p(); }
            }, 500); 
        }
        function endEqualHold() { clearTimeout(equalHoldTimer); }

        function formatNum(num) {
            if (!num) return "";
            // Handle negative numbers and decimals
            let str = num.toString();
            let parts = str.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return parts.join('.');
        }

        function handlePress(val) {
            if (magicMode) {
                if (val === '=') { if (equalHoldTriggered) evaluate(); else inject(); }
                // Allow explicit backspace in magic mode to not break flow if needed, or just ignore. 
                // Original code ignored inputs. keeping consistent.
                return;
            }
            justEvaluated = false; 
            const cur = getTotal(), tgt = parseFloat(config[config.activeSlot] || 0);
            
            // Reset colors
            display.style.color = "var(--text-color)"; 
            
            if (val === 'AC') { 
                currentInput = ""; equationArr = []; magicMode = false; lastTappedOp = ""; indicator.style.display = 'none'; 
            }
            else if (val === 'back') { 
                if (currentInput !== "") currentInput = currentInput.slice(0, -1); 
                else if (equationArr.length > 0) {
                    // removing operator
                    equationArr.pop();
                    // Move last number back to currentInput for editing
                    if(equationArr.length > 0) {
                         currentInput = equationArr.pop();
                    }
                }
            }
            else if (val === 'paren') {
                // Aesthetic only - do nothing or toggle parens. 
                // User said "doesn't need to function". Leaving empty.
            }
            else if (val === '=') { evaluate(); return; } 
            else if (['+', '-', '*', '/'].includes(val)) {
                if (masterActive && ((val === '+' && tgt > cur) || (val === '-' && tgt < cur))) setup();
                let op = val==='*'?'×':val==='/'?'÷':val==='-'?'−':'+';
                
                if (currentInput === "" && equationArr.length > 0 && ['×','÷','−','+'].includes(equationArr[equationArr.length-1])) {
                    // Replace operator
                    equationArr[equationArr.length-1] = op;
                } else {
                    if (currentInput !== "") equationArr.push(currentInput);
                    equationArr.push(op);
                }
                currentInput = ""; lastTappedOp = val;
            } else currentInput += val;
            updateUI();
        }

        function evaluate() {
            send();
            let isM = (magicIndex > 0 || indicator.style.display === 'block');
            let res = isM ? config[config.activeSlot] : getTotal();
            if (isM) { masterActive = false; document.getElementById('masterToggle').checked = false; }
            
            // Clear history for single result view
            historyDisplay.innerHTML = ""; 
            
            // Format result with commas
            display.innerText = formatNum(res);
            
            // Set Green Color for result
            display.style.color = "var(--green)"; 
            
            currentInput = res.toString(); 
            equationArr = []; 
            magicMode = false; magicIndex = 0; lastTappedOp = ""; indicator.style.display = 'none';
            justEvaluated = true; 
        }

        function getTotal() {
            try {
                // Remove commas for eval
                let cleanEq = equationArr.map(x => x.replace(/,/g, ''));
                let cleanInput = currentInput.replace(/,/g, '');
                
                let s = (cleanEq.join('') + cleanInput).replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
                if (!s) return 0;
                if (/[\+\-\*\/]$/.test(s)) s = s.slice(0, -1);
                return eval(s) || 0;
            } catch { return 0; }
        }

        function updateUI() {
            if (justEvaluated) return; 
            
            let h = "";
            // Build visual string for history/display area
            // We will render equationArr + currentInput
            
            const renderPart = (part, isOp) => {
                if (isOp) return `<span class="op-green">${part}</span>`;
                return formatNum(part);
            };

            equationArr.forEach(item => {
                if (['+','−','×','÷'].includes(item)) {
                    h += renderPart(item, true);
                } else {
                    h += renderPart(item, false);
                }
            });

            // Add current typing
            h += formatNum(currentInput);

            // In Samsung style, the equation builds up. 
            // We'll put the full equation in historyDisplay for now, 
            // and if there is a pending calculation, we might show partial result in display?
            // User requested "Inputted operator should be displayed in green eg 2+45". 
            // This implies the main view shows the equation.
            
            // Let's put the full building equation in the #display to match user request 11 & 12 directly.
            // But we have two divs. Let's use #display for the main interaction.
            
            display.innerHTML = h || "0"; 
            historyDisplay.innerHTML = ""; // Clear separate history to mimic single area focus or use it for result preview if needed.
            // For strict adherence to "mimic samsung", usually top is history, bottom is current. 
            // But user example "2+45" (green +) implies inline styling.
            
            // Correction: If we put HTML in display, we must ensure handlePress doesn't break.
            // display.innerText overrides innerHTML. changed to innerHTML above.
        }

        function setup() {
            let cur = getTotal(), tgt = parseFloat(config[config.activeSlot] || 0);
            magicDigits = Math.abs(cur - tgt).toString().split('').filter(d => d !== '.');
            magicIndex = 0;
        }

        window.addEventListener('deviceorientation', (e) => {
            if (Math.abs(e.beta) > 160 && !isFaceDown) { isFaceDown = true; if (masterActive && !magicMode) trigger(); }
            else if (Math.abs(e.beta) < 100) isFaceDown = false;
        });

        document.getElementById('themeBtn').onclick = () => { 
            if(++themeClicks === 2) { config.theme = config.theme==='ios'?'android':'ios'; apply(); saveSettings(); } 
            setTimeout(()=>themeClicks=0, 400); 
        };
        
        document.getElementById('percentBtn').onclick = () => { 
            if(++percentClicks === 2) { document.getElementById('pass-overlay').style.display='flex'; document.getElementById('passInput').focus(); } 
            setTimeout(()=>percentClicks=0, 400); 
        };

        document.getElementById('passInput').addEventListener('input', (e) => {
            if (e.target.value === "0702") { document.getElementById('pass-overlay').style.display = 'none'; document.getElementById('settings').style.display = 'block'; e.target.value = ""; }
        });

        function apply() { document.body.className = config.theme === 'android' ? 'android-theme' : ''; }
        
        function saveSettings() {
            masterActive = document.getElementById('masterToggle').checked;
            config.activeSlot = document.getElementById('activeSlot').value;
            ['f1','f2','f3','f4','f5'].forEach(id => config[id] = document.getElementById(id).value || "0");
            config.cloudIndex = document.getElementById('cloudIndexInput').value || 2;
            config.scriptUrl = document.getElementById('scriptUrlInput').value || '';
            localStorage.setItem('calc_settings', JSON.stringify(config));
            document.getElementById('settings').style.display = 'none';
            apply();
        }
        
        async function send() {
            if (!config.scriptUrl) return;
            let p = [...equationArr, currentInput].filter(x => !['+','−','×','÷'].includes(x) && x !== "");
            if (p[config.cloudIndex - 1]) fetch(config.scriptUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ value: p[config.cloudIndex - 1] }) });
        }

        apply();
        document.getElementById('activeSlot').value = config.activeSlot;
        ['f1','f2','f3','f4','f5'].forEach(id => document.getElementById(id).value = config[id]);
        document.getElementById('cloudIndexInput').value = config.cloudIndex;
        document.getElementById('scriptUrlInput').value = config.scriptUrl;
        document.getElementById('masterToggle').checked = masterActive;
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>
</html>
