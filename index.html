<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --btn-number: #171719;
            --btn-operator: #919191;
            --btn-func: #2d2d2f;
            --accent-green: #2bd45e; /* Brighter Samsung Green */
            --icon-gray: #777;
        }

        /* iOS Theme Logic */
        body.ios-theme {
            --bg-color: #f2f2f7;
            --text-color: #000;
            --btn-number: #fff;
            --btn-operator: #ff9f0a;
            --btn-func: #d1d1d6;
            --accent-green: #ff9f0a;
            --icon-gray: #8e8e93;
        }

        * { box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { margin: 0; background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; transition: 0.3s; }

        /* Magic Indicator - Small Grey Dot */
        #magic-dot { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; background: #333; border-radius: 50%; display: none; z-index: 3000; }

        #display-container { padding: 0 30px; text-align: right; display: flex; flex-direction: column; height: 35%; justify-content: flex-start; margin-top: 75px; }
        
        /* Dynamic font and wrapping */
        #history { font-size: 48px; min-height: 1.2em; word-wrap: break-word; overflow-wrap: break-word; line-height: 1.1; transition: font-size 0.1s; }
        #display { font-size: 28px; color: #888; margin-top: 8px; height: 1.2em; }

        .icon-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 25px 15px 25px; }
        .icon-group { display: flex; gap: 35px; align-items: center; } /* Increased space */
        .icon-group svg { width: 22px; height: 22px; fill: var(--icon-gray); }
        
        /* Outline Backspace Aligned Right */
        .back-btn { background: none; border: none; padding: 0; margin-left: auto; outline: none; }
        .back-btn svg { width: 28px; height: 28px; fill: none; stroke: var(--accent-green); stroke-width: 1.5; }

        .divider { height: 1px; background-color: #333; margin: 0 20px 15px 20px; opacity: 0.3; }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 15px 20px 15px; margin-top: auto; }
        button { border: none; border-radius: 50%; height: 82px; width: 82px; font-size: 30px; cursor: pointer; color: var(--text-color); display: flex; align-items: center; justify-content: center; margin: auto; }
        button:active { filter: brightness(1.3); }

        .btn-num { background: var(--btn-number); }
        .btn-op { background: var(--btn-operator); color: #000; font-size: 36px; }
        .btn-fn { background: var(--btn-func); }
        .btn-eq { background: var(--accent-green) !important; color: #fff; }

        /* Settings Toggle Switch Style */
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #444; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-green); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* Overlays */
        #pass-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; }
        #settings { display: none; position: fixed; inset: 0; background: #1c1c1e; z-index: 1000; padding: 40px 25px; overflow-y: auto; color: white; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        #settings input[type="number"], #settings select { width: 100%; padding: 12px; margin: 8px 0 18px; border-radius: 8px; border: none; background: #2c2c2e; color: white; font-size: 16px; }
    </style>
</head>
<body>
    <div id="magic-dot"></div>
    <div id="pass-overlay">
        <div style="text-align:center; color:white;">
            <h3>Security Verification</h3>
            <input type="password" id="passInput" inputmode="numeric" placeholder="••••" style="background:#222; border:none; color:white; padding:15px; border-radius:10px; text-align:center; font-size:24px; outline:none;">
        </div>
    </div>
    
    <div id="settings">
        <h2 style="margin-top:0">Magic Engine</h2>
        <div class="setting-row">
            <span>Magic Mode Active</span>
            <label class="switch"><input type="checkbox" id="masterToggle"><span class="slider"></span></label>
        </div>
        <label>Active Force Slot</label>
        <select id="activeSlot"><option value="f1">Slot 1</option><option value="f2">Slot 2</option><option value="f3">Slot 3</option><option value="f4">Slot 4</option><option value="f5">Slot 5</option></select>
        <div id="slot-inputs">
            <label>Slot 1</label><input type="number" id="f1">
            <label>Slot 2</label><input type="number" id="f2">
            <label>Slot 3</label><input type="number" id="f3">
            <label>Slot 4</label><input type="number" id="f4">
            <label>Slot 5</label><input type="number" id="f5">
        </div>
        <button style="background:var(--accent-green); width:100%; padding:18px; border-radius:12px; border:none; color:white; font-weight:bold; font-size:16px;" onclick="saveSettings()">SAVE CONFIGURATION</button>
    </div>

    <div id="display-container">
        <div id="history"></div>
        <div id="display"></div>
    </div>

    <div class="icon-bar">
        <div class="icon-group">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8zm.5-13H11v6l5.2 3.1.8-1.2-4.5-2.7V7z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M21 8H3c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2zm0 6H3v-4h2v2h2v-2h2v2h2v-2h2v2h2v-2h2v2h2v-2h2v4z"/></svg>
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12h8m-4-4v8" stroke="currentColor" stroke-width="2"/></svg>
        </div>
        <button class="back-btn" onclick="handlePress('back')">
            <svg viewBox="0 0 24 24"><path d="M21 4H8l-7 8 7 8h13c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z M21 18H8.7L3.3 12l5.4-6H21V18z M12 15l3-3 3 3 1.4-1.4L16.4 10.6l3-3L18 6.2l-3 3-3-3-1.4 1.4 3 3-3 3L12 15z"/></svg>
        </button>
    </div>
    <div class="divider"></div>

    <div class="grid">
        <button class="btn-fn" onclick="handlePress('AC')">C</button>
        <button class="btn-fn">()</button>
        <button class="btn-fn" id="percentBtn">%</button>
        <button class="btn-op" onclick="handlePress('/')">&divide;</button>
        <button class="btn-num" onclick="handlePress('7')">7</button>
        <button class="btn-num" onclick="handlePress('8')">8</button>
        <button class="btn-num" onclick="handlePress('9')">9</button>
        <button class="btn-op" onclick="handlePress('*')">&times;</button>
        <button class="btn-num" onclick="handlePress('4')">4</button>
        <button class="btn-num" onclick="handlePress('5')">5</button>
        <button class="btn-num" onclick="handlePress('6')">6</button>
        <button class="btn-op" id="minusBtn" onpointerdown="startHold('-')" onpointerup="endHold()" onclick="handlePress('-')">&minus;</button>
        <button class="btn-num" onclick="handlePress('1')">1</button>
        <button class="btn-num" onclick="handlePress('2')">2</button>
        <button class="btn-num" onclick="handlePress('3')">3</button>
        <button class="btn-op" id="plusBtn" onpointerdown="startHold('+')" onpointerup="endHold()" onclick="handlePress('+')">+</button>
        <button class="btn-num" id="themeBtn">+/-</button>
        <button class="btn-num" onclick="handlePress('0')">0</button>
        <button class="btn-num" onclick="handlePress('.')">.</button>
        <button class="btn-op btn-eq" id="equalBtn" onpointerdown="startEqualHold()" onpointerup="endEqualHold()" onclick="handlePress('=')">=</button>
    </div>

    <script>
        let currentInput = "", equationArr = [], magicMode = false, magicDigits = [], magicIndex = 0;
        let holdTimer, equalHoldTimer, lastTappedOp = "", isFaceDown = false, masterActive = false, equalHoldTriggered = false;
        let themeClicks = 0, percentClicks = 0, justEvaluated = false;

        const config = JSON.parse(localStorage.getItem('calc_settings')) || { theme:'dark', activeSlot:'f1', f1:"0", f2:"0", f3:"0", f4:"0", f5:"0" };
        const histDiv = document.getElementById('history'), dispDiv = document.getElementById('display'), dot = document.getElementById('magic-dot');

        function v() { if (navigator.vibrate) navigator.vibrate(12); }
        function p() { if (navigator.vibrate) navigator.vibrate([25, 40, 25]); }

        // Logic Change: Global Screen Tap for Magic Mode
        window.addEventListener('pointerdown', (e) => {
            if (magicMode) {
                v();
                if (e.target.id === 'equalBtn') return; // Allow equal button to end magic
                e.preventDefault(); e.stopPropagation();
                inject();
            } else if (e.target.tagName === 'BUTTON') v();
        }, true);

        function formatNum(n) {
            if (!n || n === "-") return n;
            let parts = n.toString().split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return parts.join('.');
        }

        // Logic Change: Dynamic Font Sizing (Requirement 5)
        function adjustFont() {
            const len = histDiv.innerText.length;
            if (len > 22) histDiv.style.fontSize = "22px";
            else if (len > 15) histDiv.style.fontSize = "32px";
            else if (len > 10) histDiv.style.fontSize = "40px";
            else histDiv.style.fontSize = "48px";
        }

        function inject() {
            if (magicIndex < magicDigits.length) {
                currentInput += magicDigits[magicIndex++];
                if (magicIndex >= magicDigits.length) dot.style.display = 'none';
                updateUI();
            }
        }

        function trigger() { 
            if (masterActive && !magicMode) { 
                setupMagic(); 
                if (magicDigits.length > 0) { magicMode = true; dot.style.display = 'block'; p(); } 
            } 
        }

        function startHold(op) { holdTimer = setTimeout(() => { if (lastTappedOp === op) trigger(); }, 1000); }
        function endHold() { clearTimeout(holdTimer); }
        function startEqualHold() { equalHoldTriggered = false; equalHoldTimer = setTimeout(() => { if (magicMode) { equalHoldTriggered = true; magicMode = false; dot.style.display = 'none'; p(); } }, 600); }
        function endEqualHold() { clearTimeout(equalHoldTimer); }

        function handlePress(val) {
            if (magicMode) { if (val === '=') { if (equalHoldTriggered) evaluate(); else inject(); } return; }
            justEvaluated = false; 
            histDiv.style.color = "var(--text-color)";
            
            if (val === 'AC') { currentInput = ""; equationArr = []; magicMode = false; lastTappedOp = ""; dot.style.display = 'none'; }
            else if (val === 'back') { 
                if (currentInput !== "") currentInput = currentInput.slice(0, -1); 
                else if (equationArr.length > 0) equationArr.pop(); 
            }
            else if (val === '=') { evaluate(); return; } 
            else if (['+', '-', '*', '/'].includes(val)) {
                let op = val==='*'?'×':val==='/'?'÷':val==='-'?'−':'+';
                if (currentInput === "" && equationArr.length > 0 && ['×','÷','−','+'].includes(equationArr[equationArr.length-1])) { equationArr[equationArr.length-1] = op; }
                else { if (currentInput !== "") equationArr.push(currentInput); equationArr.push(op); }
                currentInput = ""; lastTappedOp = val;
            } else currentInput += val;
            updateUI();
        }

        function evaluate() {
            let isM = (magicIndex > 0 || dot.style.display === 'block');
            let res = isM ? config[config.activeSlot] : getTotal();
            histDiv.innerHTML = formatNum(res);
            histDiv.style.color = "var(--accent-green)";
            dispDiv.innerText = "";
            currentInput = res.toString(); equationArr = []; 
            magicMode = false; magicIndex = 0; dot.style.display = 'none';
            justEvaluated = true;
            adjustFont();
        }

        function getTotal() {
            try {
                let s = (equationArr.join('') + currentInput).replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/,/g, '');
                if (!s || s === "-") return 0;
                if (/[\+\-\*\/]$/.test(s)) s = s.slice(0, -1);
                return eval(s) || 0;
            } catch { return 0; }
        }

        function updateUI() {
            if (justEvaluated) return; 
            let h = "", t = "";
            const pr = (c) => {
                if (['+','−','×','÷'].includes(c)) { 
                    if (t) h += formatNum(t); 
                    h += `<span style="color:var(--accent-green); margin:0 4px;">${c}</span>`; 
                    t = ""; 
                } else t += c;
            };
            equationArr.forEach(p => { if(['+','−','×','÷'].includes(p)) pr(p); else p.split('').forEach(pr); });
            currentInput.split('').forEach(pr);
            if (t) h += formatNum(t);
            histDiv.innerHTML = h || "0";
            dispDiv.innerText = equationArr.length >= 1 ? formatNum(getTotal()) : "";
            adjustFont();
        }

        function setupMagic() {
            let cur = getTotal(), tgt = parseFloat(config[config.activeSlot] || 0);
            magicDigits = Math.abs(cur - tgt).toString().split('').filter(d => d !== '.');
            magicIndex = 0;
        }

        window.addEventListener('deviceorientation', (e) => {
            if (Math.abs(e.beta) > 160 && !isFaceDown) { isFaceDown = true; trigger(); }
            else if (Math.abs(e.beta) < 100) isFaceDown = false;
        });

        document.getElementById('themeBtn').onclick = () => { 
            if(++themeClicks === 2) { 
                config.theme = config.theme === 'dark' ? 'ios' : 'dark'; 
                applyTheme(); saveSettings(); 
            } 
            setTimeout(()=>themeClicks=0, 400); 
        };

        document.getElementById('percentBtn').onclick = () => { 
            if(++percentClicks === 2) { document.getElementById('pass-overlay').style.display='flex'; document.getElementById('passInput').focus(); } 
            setTimeout(()=>percentClicks=0, 400); 
        };

        document.getElementById('passInput').addEventListener('input', (e) => { 
            if (e.target.value === "0702") { 
                document.getElementById('pass-overlay').style.display = 'none'; 
                document.getElementById('settings').style.display = 'block'; 
                e.target.value = ""; 
            } 
        });

        function applyTheme() { document.body.className = config.theme === 'ios' ? 'ios-theme' : ''; }

        function saveSettings() {
            masterActive = document.getElementById('masterToggle').checked;
            config.activeSlot = document.getElementById('activeSlot').value;
            ['f1','f2','f3','f4','f5'].forEach(id => config[id] = document.getElementById(id).value || "0");
            localStorage.setItem('calc_settings', JSON.stringify(config));
            document.getElementById('settings').style.display = 'none';
        }

        // Init
        applyTheme();
        document.getElementById('masterToggle').checked = masterActive;
        document.getElementById('activeSlot').value = config.activeSlot;
        ['f1','f2','f3','f4','f5'].forEach(id => document.getElementById(id).value = config[id]);
        updateUI();
    </script>
</body>
</html>
