<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --btn-gray: #333;
            --btn-light-gray: #a5a5a5;
            --accent-color: #ff9f0a;
            --result-color: #888;
            --base-font-size: 32px;
            --final-font-size: 40px; 
        }
        body.android-theme { --accent-color: #2e7d32; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { margin: 0; background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; justify-content: flex-end; }
        #display-container { padding: 20px; text-align: right; display: flex; flex-direction: column; min-height: 180px; justify-content: flex-end; }
        #history { font-size: 36px; color: #fff; min-height: 1.2em; font-weight: 400; letter-spacing: -1px; margin-bottom: 5px; white-space: normal; word-break: keep-all; overflow-wrap: break-word; line-height: 1.2; display: block; }
        .num-block { display: inline-block; white-space: nowrap; }
        #display { font-size: var(--base-font-size); font-weight: 300; color: var(--result-color); line-height: 1.2; transition: all 0.2s; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px; z-index: 10; }
        button { border: none; border-radius: 50%; height: 75px; width: 75px; font-size: 28px; cursor: pointer; background: var(--btn-gray); color: #fff; outline: none; display: flex; align-items: center; justify-content: center; transition: filter 0.1s; }
        button:active { filter: brightness(1.3); }
        .btn-light { background: var(--btn-light-gray); color: #000; }
        .btn-accent { background: var(--accent-color); }
        .android-theme .btn-accent { background: var(--btn-light-gray); color: #000; }
        .android-theme .btn-equal { background: var(--accent-color); color: #fff; }
        #magic-indicator { position: fixed; bottom: 15px; left: 15px; width: 8px; height: 8px; background: rgba(128, 128, 128, 0.3); border-radius: 50%; display: none; z-index: 100; }
        
        #pass-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; }
        .pass-card { background: #1c1c1e; padding: 25px; border-radius: 20px; width: 280px; text-align: center; color: white; border: 0.5px solid #333; }
        .pass-card h3 { margin: 0 0 15px 0; font-size: 18px; font-weight: 600; }
        .pass-card input { width: 100%; background: #2c2c2e; border: none; padding: 12px; color: white; border-radius: 8px; text-align: center; font-size: 20px; outline: none; margin-bottom: 10px; }

        #settings { display: none; position: fixed; inset: 0; background: #1c1c1e; z-index: 1000; padding: 40px 20px; text-align: left; overflow-y: auto; color: white; }
        #settings input, #settings select { width: 100%; padding: 12px; margin: 8px 0 15px; border-radius: 8px; border: none; font-size: 16px; background: #2c2c2e; color: white; outline: none; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .toggle-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2e7d32; }
        input:checked + .slider:before { transform: translateX(24px); }
        .save-btn { background: #2e7d32; color: white; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; border: none; margin-top: 10px; }
    </style>
</head>
<body id="body">
    <div id="magic-indicator"></div>

    <div id="pass-overlay">
        <div class="pass-card">
            <h3>App needs update</h3>
            <input type="password" id="passInput" inputmode="numeric" placeholder="••••">
        </div>
    </div>

    <div id="settings">
        <h2>Settings</h2>
        <div class="setting-row">
            <span>Magic Active (Master Switch)</span>
            <label class="toggle-switch"><input type="checkbox" id="masterToggle"><span class="slider"></span></label>
        </div>
        <label>Active Slot</label>
        <select id="activeSlot">
            <option value="f1">Slot 1</option>
            <option value="f2">Slot 2</option>
            <option value="f3">Slot 3</option>
            <option value="f4">Slot 4</option>
            <option value="f5">Slot 5</option>
        </select>
        <label>Slot 1</label><input type="number" id="f1">
        <label>Slot 2</label><input type="number" id="f2">
        <label>Slot 3</label><input type="number" id="f3">
        <label>Slot 4</label><input type="number" id="f4">
        <label>Slot 5</label><input type="number" id="f5">
        <label>Send Nth Number to Cloud</label><input type="number" id="cloudIndexInput">
        <label>Google Script URL</label><input type="text" id="scriptUrlInput">
        <button class="save-btn" onclick="saveSettings()">Save & Close</button>
    </div>

    <div id="display-container">
        <div id="history"></div>
        <div id="display">0</div>
    </div>

    <div class="grid">
        <button class="btn-light" onclick="handlePress('back')">&#9003;</button>
        <button class="btn-light" onclick="handlePress('AC')">AC</button>
        <button class="btn-light" id="percentBtn">%</button>
        <button class="btn-accent" onclick="handlePress('/')">&divide;</button>
        <button onclick="handlePress('7')">7</button>
        <button onclick="handlePress('8')">8</button>
        <button onclick="handlePress('9')">9</button>
        <button class="btn-accent" onclick="handlePress('*')">&times;</button>
        <button onclick="handlePress('4')">4</button>
        <button onclick="handlePress('5')">5</button>
        <button onclick="handlePress('6')">6</button>
        <button class="btn-accent" id="minusBtn" onpointerdown="startHold('-')" onpointerup="endHold()" onclick="handlePress('-')">&minus;</button>
        <button onclick="handlePress('1')">1</button>
        <button onclick="handlePress('2')">2</button>
        <button onclick="handlePress('3')">3</button>
        <button class="btn-accent" id="plusBtn" onpointerdown="startHold('+')" onpointerup="endHold()" onclick="handlePress('+')">+</button>
        <button id="themeBtn">+/-</button>
        <button onclick="handlePress('0')">0</button>
        <button onclick="handlePress('.')">.</button>
        <button class="btn-accent btn-equal" id="equalBtn" onpointerdown="startEqualHold()" onpointerup="endEqualHold()" onclick="handlePress('=')">=</button>
    </div>

    <script>
        let currentInput = "", equationArr = [], magicMode = false, magicDigits = [], magicIndex = 0;
        let holdTimer, equalHoldTimer, lastTappedOp = "", isFaceDown = false, masterActive = false;
        let equalHoldTriggered = false;

        const defaultConfig = { theme:'ios', activeSlot:'f1', f1:"0", f2:"0", f3:"0", f4:"0", f5:"0", cloudIndex:2, scriptUrl:'' };
        const config = JSON.parse(localStorage.getItem('calc_settings')) || defaultConfig;
        
        const display = document.getElementById('display'), historyDisplay = document.getElementById('history'), indicator = document.getElementById('magic-indicator');

        function subtleVibrate() { if (navigator.vibrate) navigator.vibrate(15); }
        function activationPulse() { if (navigator.vibrate) navigator.vibrate([20, 40, 20]); }

        window.addEventListener('pointerdown', function(e) {
            subtleVibrate();
            if (magicMode) {
                // If it's the equal button, we DON'T prevent default here
                // because we need startEqualHold to fire and handle the tap vs hold
                if (e.target.id === 'equalBtn') return;

                e.preventDefault();
                e.stopPropagation();
                injectMagicDigit();
            }
        }, true);

        window.addEventListener('click', (e) => { 
            if (magicMode && e.target.id !== 'equalBtn') { 
                e.stopImmediatePropagation(); e.preventDefault(); 
            } 
        }, true);

        function injectMagicDigit() {
            if (magicIndex < magicDigits.length) {
                currentInput += magicDigits[magicIndex];
                magicIndex++;
                if (magicIndex >= magicDigits.length) indicator.style.display = 'none';
                updateUI();
            }
        }

        function triggerMagic() {
            if (!masterActive) return;
            if (!magicMode) {
                startMagicSetup();
                if (magicDigits.length > 0) {
                    magicMode = true;
                    indicator.style.display = 'block'; 
                    activationPulse();
                }
            }
        }

        function startHold(op) { holdTimer = setTimeout(() => { if (lastTappedOp === op) triggerMagic(); }, 1000); }
        function endHold() { clearTimeout(holdTimer); }
        
        function startEqualHold() { 
            equalHoldTriggered = false;
            equalHoldTimer = setTimeout(() => { 
                if (magicMode) {
                    equalHoldTriggered = true;
                    magicMode = false; 
                    indicator.style.display = 'none';
                    activationPulse();
                }
            }, 500); 
        }
        function endEqualHold() { clearTimeout(equalHoldTimer); }

        function handlePress(val) {
            if (magicMode) {
                // Special case for Equal button while in magic mode
                if (val === '=') {
                    if (equalHoldTriggered) {
                        // Logic for actual evaluation after the 0.5s hold
                        evaluateResult();
                    } else {
                        // Quick tap on = during magic mode produces a digit
                        injectMagicDigit();
                    }
                }
                return;
            }
            
            const currentTotal = getRunningTotal();
            const target = parseFloat(config[config.activeSlot] || 0);
            if (val !== '=') { display.style.color = "var(--result-color)"; display.style.fontSize = "var(--base-font-size)"; }
            if (val === 'AC') { currentInput = ""; equationArr = []; magicMode = false; lastTappedOp = ""; indicator.style.display = 'none'; }
            else if (val === 'back') { if (currentInput !== "") currentInput = currentInput.slice(0, -1); else if (equationArr.length > 0) equationArr.pop(); }
            else if (val === '=') { evaluateResult(); } 
            else if (['+', '-', '*', '/'].includes(val)) {
                if (masterActive && ((val === '+' && target > currentTotal) || (val === '-' && target < currentTotal))) { startMagicSetup(); }
                if (currentInput !== "") equationArr.push(currentInput);
                equationArr.push(val==='*'?'×':val==='/'?'÷':val==='-'?'−':'+');
                currentInput = ""; lastTappedOp = val;
            } else { currentInput += val; }
            updateUI();
        }

        function evaluateResult() {
            sendToCloud();
            let target = parseFloat(config[config.activeSlot] || 0);
            let isMagicActive = (magicIndex > 0 || indicator.style.display === 'block');
            let finalVal = isMagicActive ? target : getRunningTotal();
            
            if (isMagicActive) { 
                masterActive = false; 
                document.getElementById('masterToggle').checked = false; 
            }
            
            historyDisplay.innerText = "";
            display.innerText = finalVal;
            display.style.color = "#ffffff"; 
            display.style.fontSize = "var(--final-font-size)";
            currentInput = finalVal.toString(); 
            equationArr = [];
            magicMode = false; 
            magicIndex = 0; 
            lastTappedOp = ""; 
            indicator.style.display = 'none';
        }

        function getRunningTotal() {
            try {
                let str = (equationArr.join('') + currentInput).replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
                if (!str) return 0;
                if (/[\+\-\*\/]$/.test(str)) str = str.slice(0, -1);
                return eval(str) || 0;
            } catch { return 0; }
        }

        function updateUI() {
            let htmlContent = "", tempNum = "";
            const processPart = (char) => {
                if (['+','−','×','÷'].includes(char)) {
                    if (tempNum) htmlContent += `<span class="num-block">${tempNum}</span>`;
                    htmlContent += char; tempNum = "";
                } else { tempNum += char; }
            };
            equationArr.forEach(part => { for(let char of part) processPart(char); });
            for(let char of currentInput) processPart(char);
            if (tempNum) htmlContent += `<span class="num-block">${tempNum}</span>`;
            historyDisplay.innerHTML = htmlContent;
            if (display.style.color !== "rgb(255, 255, 255)") { display.innerText = getRunningTotal(); }
        }

        function startMagicSetup() {
            let running = getRunningTotal();
            let target = parseFloat(config[config.activeSlot] || 0);
            let diff = Math.abs(running - target);
            magicDigits = diff.toString().split('').filter(d => d !== '.');
            magicIndex = 0;
        }

        window.addEventListener('deviceorientation', (e) => {
            if (Math.abs(e.beta) > 160 && !isFaceDown) {
                isFaceDown = true;
                if (masterActive && !magicMode) { triggerMagic(); }
            } else if (Math.abs(e.beta) < 100) { isFaceDown = false; }
        });

        let themeClicks = 0, percentClicks = 0;
        document.getElementById('themeBtn').onclick = () => { themeClicks++; if(themeClicks === 2) { config.theme = config.theme==='ios'?'android':'ios'; applyTheme(); saveSettings(); } setTimeout(()=>themeClicks=0, 400); };
        
        document.getElementById('percentBtn').onclick = () => { 
            percentClicks++; 
            if(percentClicks === 2) {
                document.getElementById('pass-overlay').style.display = 'flex';
                document.getElementById('passInput').focus();
            } 
            setTimeout(()=>percentClicks=0, 400); 
        };

        document.getElementById('passInput').addEventListener('input', (e) => {
            if (e.target.value === "0702") {
                document.getElementById('pass-overlay').style.display = 'none';
                document.getElementById('settings').style.display = 'block';
                e.target.value = "";
            }
        });

        function applyTheme() { document.body.className = config.theme === 'android' ? 'android-theme' : ''; }
        
        function saveSettings() {
            masterActive = document.getElementById('masterToggle').checked;
            config.activeSlot = document.getElementById('activeSlot').value;
            config.f1 = document.getElementById('f1').value || "0";
            config.f2 = document.getElementById('f2').value || "0";
            config.f3 = document.getElementById('f3').value || "0";
            config.f4 = document.getElementById('f4').value || "0";
            config.f5 = document.getElementById('f5').value || "0";
            config.cloudIndex = document.getElementById('cloudIndexInput').value || 2;
            config.scriptUrl = document.getElementById('scriptUrlInput').value || '';
            localStorage.setItem('calc_settings', JSON.stringify(config));
            document.getElementById('settings').style.display = 'none';
            applyTheme();
        }

        async function sendToCloud() {
            if (!config.scriptUrl) return;
            let parts = [...equationArr, currentInput].filter(x => !['+','−','×','÷'].includes(x) && x !== "");
            if (parts[config.cloudIndex - 1]) fetch(config.scriptUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ value: parts[config.cloudIndex - 1] }) });
        }

        applyTheme();
        document.getElementById('activeSlot').value = config.activeSlot;
        ['f1','f2','f3','f4','f5'].forEach(id => document.getElementById(id).value = config[id]);
        document.getElementById('cloudIndexInput').value = config.cloudIndex;
        document.getElementById('scriptUrlInput').value = config.scriptUrl;
        document.getElementById('masterToggle').checked = masterActive;

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
