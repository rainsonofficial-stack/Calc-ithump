<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --btn-number: #171719;
            --btn-operator: #919191;
            --btn-func: #2d2d2f;
            --accent-green: #21A613;
            --icon-gray: #494949;
        }
        * { box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { margin: 0; background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Requirement 13: Top align with 75px margin */
        #display-container { padding: 0 30px; text-align: right; display: flex; flex-direction: column; height: 35%; justify-content: flex-start; margin-top: 75px; }
        #history { font-size: 42px; color: #fff; min-height: 1.2em; word-break: break-all; line-height: 1.2; }
        #display { font-size: 30px; color: #888; margin-top: 10px; height: 1.2em; }

        /* Requirement 10: Icon bar */
        .icon-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 25px 12px 25px; color: var(--icon-gray); }
        .icon-group { display: flex; gap: 22px; }
        .icon-group svg { width: 20px; height: 20px; fill: var(--icon-gray); }
        /* Requirement 3: Green backspace no background */
        .back-btn { background: none; border: none; padding: 0; outline: none; }
        .back-btn svg { width: 26px; height: 26px; fill: var(--accent-green); }

        /* Requirement 9: Thin line */
        .divider { height: 1px; background-color: #222; margin: 0 20px 15px 20px; }

        /* Requirement 7: Larger circles, less space */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 15px 20px 15px; margin-top: auto; }
        button { border: none; border-radius: 50%; height: 82px; width: 82px; font-size: 28px; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; margin: auto; }
        button:active { filter: brightness(1.4); }

        /* Requirements 4, 5, 6, 8: Colors */
        .btn-num { background: var(--btn-number); }
        .btn-op { background: var(--btn-operator); color: #000; font-size: 32px; }
        .btn-fn { background: var(--btn-func); }
        .btn-eq { background: var(--accent-green) !important; }

        /* Overlays */
        #magic-indicator { position: fixed; top: 5px; left: 5px; width: 5px; height: 5px; background: rgba(33,166,19,0.3); border-radius: 50%; display: none; }
        #pass-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; }
        .pass-card { background: #1c1c1e; padding: 25px; border-radius: 20px; width: 280px; text-align: center; border: 0.5px solid #333; }
        .pass-card input { width: 100%; background: #2c2c2e; border: none; padding: 12px; color: white; border-radius: 8px; text-align: center; font-size: 20px; outline: none; }
        #settings { display: none; position: fixed; inset: 0; background: #1c1c1e; z-index: 1000; padding: 30px 20px; overflow-y: auto; color: white; }
        #settings input, #settings select { width: 100%; padding: 10px; margin: 5px 0 15px; border-radius: 8px; border: none; background: #2c2c2e; color: white; }
    </style>
</head>
<body>
    <div id="magic-indicator"></div>
    <div id="pass-overlay"><div class="pass-card"><h3>System Update</h3><input type="password" id="passInput" inputmode="numeric" placeholder="••••"></div></div>
    
    <div id="settings">
        <h3>Settings</h3>
        <label>Magic Active</label><input type="checkbox" id="masterToggle">
        <label>Active Slot</label><select id="activeSlot"><option value="f1">Slot 1</option><option value="f2">Slot 2</option><option value="f3">Slot 3</option><option value="f4">Slot 4</option><option value="f5">Slot 5</option></select>
        <label>Slot 1</label><input type="number" id="f1">
        <label>Slot 2</label><input type="number" id="f2">
        <label>Slot 3</label><input type="number" id="f3">
        <label>Slot 4</label><input type="number" id="f4">
        <label>Slot 5</label><input type="number" id="f5">
        <label>Cloud URL</label><input type="text" id="scriptUrlInput">
        <button style="background:var(--accent-green); width:100%; padding:15px; border-radius:8px; border:none; color:white;" onclick="saveSettings()">Save</button>
    </div>

    <div id="display-container"><div id="history"></div><div id="display"></div></div>

    <div class="icon-bar">
        <div class="icon-group">
            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M7 2v2h10V2H7zm10 18v2H7v-2h10zM5 18h14v2H5v-2zm0-4h14v2H5v-2zm0-4h14v2H5v-2zm0-4h14v2H5V6z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
        </div>
        <button class="back-btn" onclick="handlePress('back')">
            <svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3.91 13.09L16.09 18l-4.09-4.09L7.91 18 6 16.09l4.09-4.09L6 7.91 7.91 6l4.09 4.09L16.09 6 18 7.91l-4.09 4.09L18 16.09z"/></svg>
        </button>
    </div>
    <div class="divider"></div>

    <div class="grid">
        <button class="btn-fn" onclick="handlePress('AC')">C</button>
        <button class="btn-fn">()</button>
        <button class="btn-fn" id="percentBtn">%</button>
        <button class="btn-op" onclick="handlePress('/')">&divide;</button>
        <button class="btn-num" onclick="handlePress('7')">7</button>
        <button class="btn-num" onclick="handlePress('8')">8</button>
        <button class="btn-num" onclick="handlePress('9')">9</button>
        <button class="btn-op" onclick="handlePress('*')">&times;</button>
        <button class="btn-num" onclick="handlePress('4')">4</button>
        <button class="btn-num" onclick="handlePress('5')">5</button>
        <button class="btn-num" onclick="handlePress('6')">6</button>
        <button class="btn-op" id="minusBtn" onpointerdown="startHold('-')" onpointerup="endHold()" onclick="handlePress('-')">&minus;</button>
        <button class="btn-num" onclick="handlePress('1')">1</button>
        <button class="btn-num" onclick="handlePress('2')">2</button>
        <button class="btn-num" onclick="handlePress('3')">3</button>
        <button class="btn-op" id="plusBtn" onpointerdown="startHold('+')" onpointerup="endHold()" onclick="handlePress('+')">+</button>
        <button class="btn-num" id="themeBtn">+/-</button>
        <button class="btn-num" onclick="handlePress('0')">0</button>
        <button class="btn-num" onclick="handlePress('.')">.</button>
        <button class="btn-op btn-eq" id="equalBtn" onpointerdown="startEqualHold()" onpointerup="endEqualHold()" onclick="handlePress('=')">=</button>
    </div>

    <script>
        let currentInput = "", equationArr = [], magicMode = false, magicDigits = [], magicIndex = 0;
        let holdTimer, equalHoldTimer, lastTappedOp = "", isFaceDown = false, masterActive = false, equalHoldTriggered = false;
        let themeClicks = 0, percentClicks = 0, justEvaluated = false;

        const config = JSON.parse(localStorage.getItem('calc_settings')) || { activeSlot:'f1', f1:"0", f2:"0", f3:"0", f4:"0", f5:"0", scriptUrl:'' };
        const display = document.getElementById('display'), historyDisplay = document.getElementById('history'), indicator = document.getElementById('magic-indicator');

        function v() { if (navigator.vibrate) navigator.vibrate(15); }
        function p() { if (navigator.vibrate) navigator.vibrate([20, 40, 20]); }

        window.addEventListener('pointerdown', (e) => {
            if (magicMode && e.target.tagName === 'BUTTON') {
                v(); if (e.target.id === 'equalBtn') return;
                e.preventDefault(); e.stopPropagation(); inject();
            } else if (e.target.tagName === 'BUTTON') v();
        }, true);

        function formatNum(n) {
            if (!n || n === "-") return n;
            let parts = n.toString().split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return parts.join('.');
        }

        function inject() {
            if (magicIndex < magicDigits.length) {
                currentInput += magicDigits[magicIndex++];
                if (magicIndex >= magicDigits.length) indicator.style.display = 'none';
                updateUI();
            }
        }

        function trigger() { if (masterActive && !magicMode) { setup(); if (magicDigits.length > 0) { magicMode = true; indicator.style.display = 'block'; p(); } } }

        function startHold(op) { holdTimer = setTimeout(() => { if (lastTappedOp === op) trigger(); }, 1000); }
        function endHold() { clearTimeout(holdTimer); }
        function startEqualHold() { equalHoldTriggered = false; equalHoldTimer = setTimeout(() => { if (magicMode) { equalHoldTriggered = true; magicMode = false; indicator.style.display = 'none'; p(); } }, 500); }
        function endEqualHold() { clearTimeout(equalHoldTimer); }

        function handlePress(val) {
            if (magicMode) { if (val === '=') { if (equalHoldTriggered) evaluate(); else inject(); } return; }
            justEvaluated = false; 
            if (val !== '=') { historyDisplay.style.color = "#fff"; }
            if (val === 'AC') { currentInput = ""; equationArr = []; magicMode = false; lastTappedOp = ""; indicator.style.display = 'none'; }
            else if (val === 'back') { if (currentInput !== "") currentInput = currentInput.slice(0, -1); else if (equationArr.length > 0) equationArr.pop(); }
            else if (val === '=') { evaluate(); return; } 
            else if (['+', '-', '*', '/'].includes(val)) {
                let op = val==='*'?'×':val==='/'?'÷':val==='-'?'−':'+';
                if (currentInput === "" && equationArr.length > 0 && ['×','÷','−','+'].includes(equationArr[equationArr.length-1])) { equationArr[equationArr.length-1] = op; }
                else { if (currentInput !== "") equationArr.push(currentInput); equationArr.push(op); }
                currentInput = ""; lastTappedOp = val;
            } else currentInput += val;
            updateUI();
        }

        function evaluate() {
            let isM = (magicIndex > 0 || indicator.style.display === 'block');
            let res = isM ? config[config.activeSlot] : getTotal();
            historyDisplay.innerHTML = formatNum(res);
            historyDisplay.style.color = "var(--accent-green)";
            display.innerText = "";
            currentInput = res.toString(); equationArr = []; 
            magicMode = false; magicIndex = 0; indicator.style.display = 'none';
            justEvaluated = true; 
        }

        function getTotal() {
            try {
                let s = (equationArr.join('') + currentInput).replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/,/g, '');
                if (!s) return 0;
                if (/[\+\-\*\/]$/.test(s)) s = s.slice(0, -1);
                return eval(s) || 0;
            } catch { return 0; }
        }

        function updateUI() {
            if (justEvaluated) return; 
            let h = "", t = "";
            const pr = (c) => {
                if (['+','−','×','÷'].includes(c)) { 
                    if (t) h += formatNum(t); 
                    h += `<span style="color:var(--accent-green); margin:0 4px;">${c}</span>`; 
                    t = ""; 
                } else t += c;
            };
            equationArr.forEach(p => { if(['+','−','×','÷'].includes(p)) pr(p); else p.split('').forEach(pr); });
            currentInput.split('').forEach(pr);
            if (t) h += formatNum(t);
            historyDisplay.innerHTML = h;
            display.innerText = equationArr.length >= 1 ? formatNum(getTotal()) : "";
        }

        function setup() {
            let cur = getTotal(), tgt = parseFloat(config[config.activeSlot] || 0);
            magicDigits = Math.abs(cur - tgt).toString().split('').filter(d => d !== '.');
            magicIndex = 0;
        }

        window.addEventListener('deviceorientation', (e) => {
            if (Math.abs(e.beta) > 160 && !isFaceDown) { isFaceDown = true; trigger(); }
            else if (Math.abs(e.beta) < 100) isFaceDown = false;
        });

        document.getElementById('themeBtn').onclick = () => { if(++themeClicks === 2) { alert("Theme logic preserved"); } setTimeout(()=>themeClicks=0, 400); };
        document.getElementById('percentBtn').onclick = () => { if(++percentClicks === 2) { document.getElementById('pass-overlay').style.display='flex'; document.getElementById('passInput').focus(); } setTimeout(()=>percentClicks=0, 400); };
        document.getElementById('passInput').addEventListener('input', (e) => { if (e.target.value === "0702") { document.getElementById('pass-overlay').style.display = 'none'; document.getElementById('settings').style.display = 'block'; e.target.value = ""; } });

        function saveSettings() {
            masterActive = document.getElementById('masterToggle').checked;
            config.activeSlot = document.getElementById('activeSlot').value;
            ['f1','f2','f3','f4','f5'].forEach(id => config[id] = document.getElementById(id).value || "0");
            localStorage.setItem('calc_settings', JSON.stringify(config));
            document.getElementById('settings').style.display = 'none';
        }

        document.getElementById('activeSlot').value = config.activeSlot;
        ['f1','f2','f3','f4','f5'].forEach(id => document.getElementById(id).value = config[id]);
    </script>
</body>
</html>
